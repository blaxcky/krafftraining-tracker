name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ codex-complete-redesign ]
  pull_request:
    branches: [ codex-complete-redesign ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      env:
        FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      run: npm run build

    - name: Test asset validation
      run: npm test

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'www'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex-complete-redesign'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
